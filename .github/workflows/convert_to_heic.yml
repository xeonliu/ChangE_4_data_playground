name: Convert PDS4 to HDR HEIC

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # ---------------------------------------------------------------
      # 1. Check out repository
      # ---------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ---------------------------------------------------------------
      # 3. Install Python dependencies
      # ---------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------------
      # 4. Download CE4 sample files from CLPF open data portal.
      #    Three files are downloaded for each image type:
      #      - TCAM   : terrain camera (Array_3D_Image, already-RGB)
      #      - PCAM-C : close-up camera colour (Array_2D_Image, Bayer RGGB)
      #      - PCAM-Q : panoramic panchromatic  (Array_2D_Image, greyscale)
      #
      #    If the server is unreachable, synthetic fallback data are
      #    generated by generate_sample_pds4.py instead.
      # ---------------------------------------------------------------
      - name: Download CE4 sample files
        run: |
          mkdir -p TCAM PCAM

          BASE="http://moon.bao.ac.cn/cedownload/CE4ROLL/CE4"

          # ── TCAM (same file used in first_glance.ipynb) ─────────────
          TCAM_STEM="CE4_GRAS_TCAM-I-065_SCI_N_20190111190315_20190111190315_0009_A"
          TCAM_PATH="${BASE}/TCAM/I/2C/2019-03/${TCAM_STEM}"
          echo "Downloading TCAM label …"
          curl --silent --show-error --fail --max-time 120 \
               -o "TCAM/${TCAM_STEM}.2CL" "${TCAM_PATH}.2CL" || true
          echo "Downloading TCAM data …"
          curl --silent --show-error --fail --max-time 300 \
               -o "TCAM/${TCAM_STEM}.2C"  "${TCAM_PATH}.2C"  || true

          # ── PCAM colour (same file used in first_glance.ipynb) ──────
          PCAMC_STEM="CE4_GRAS_PCAML-C-006_SCI_N_20190104084559_20190104084559_0001_B"
          PCAMC_PATH="${BASE}/PCAML/C/2B/2019-07/${PCAMC_STEM}"
          echo "Downloading PCAM-C label …"
          curl --silent --show-error --fail --max-time 120 \
               -o "PCAM/${PCAMC_STEM}.2BL" "${PCAMC_PATH}.2BL" || true
          echo "Downloading PCAM-C data …"
          curl --silent --show-error --fail --max-time 300 \
               -o "PCAM/${PCAMC_STEM}.2B"  "${PCAMC_PATH}.2B"  || true

          # ── PCAM panchromatic (same file used in first_glance.ipynb) ─
          PCAMQ_STEM="CE4_GRAS_PCAMR-Q-032_SCI_N_20190112082618_20190112082618_0003_B"
          PCAMQ_PATH="${BASE}/PCAMR/Q/2B/2019-07/${PCAMQ_STEM}"
          echo "Downloading PCAM-Q label …"
          curl --silent --show-error --fail --max-time 120 \
               -o "PCAM/${PCAMQ_STEM}.2BL" "${PCAMQ_PATH}.2BL" || true
          echo "Downloading PCAM-Q data …"
          curl --silent --show-error --fail --max-time 300 \
               -o "PCAM/${PCAMQ_STEM}.2B"  "${PCAMQ_PATH}.2B"  || true

          # Check what we got
          echo ""
          echo "=== Downloaded files ==="
          ls -lh TCAM/ PCAM/
        continue-on-error: true

      # ---------------------------------------------------------------
      # 5. Generate synthetic fallback data for any missing files
      #    (This ensures the pipeline always has data to process, even
      #    when the upstream server is unreachable from CI.)
      # ---------------------------------------------------------------
      - name: Generate synthetic fallback if downloads failed
        run: |
          # Count PDS4 label files across both directories
          LABEL_COUNT=$(find TCAM PCAM -name "*.2?L" 2>/dev/null | wc -l || echo 0)
          echo "Label files found: ${LABEL_COUNT}"

          if [ "${LABEL_COUNT}" -lt 3 ]; then
            echo "Fewer than 3 label files – generating synthetic sample data …"
            # Use full-resolution-like dimensions for realistic testing
            # (scaled down to 864×1176 to keep CI fast)
            python generate_sample_pds4.py \
              --output-dir synthetic_data \
              --height 864 \
              --width 1176
            # Merge into expected directories so the conversion step is uniform
            cp synthetic_data/*.2CL synthetic_data/*.2C TCAM/ 2>/dev/null || true
            cp synthetic_data/*.2BL synthetic_data/*.2B  PCAM/ 2>/dev/null || true
            echo ""
            echo "=== Files after synthetic generation ==="
            ls -lh TCAM/ PCAM/
          else
            echo "Download succeeded – using real CE4 data."
          fi

      # ---------------------------------------------------------------
      # 6. Convert all PDS4 labels to HDR HEIC
      # ---------------------------------------------------------------
      - name: Convert PDS4 → HDR HEIC
        run: |
          mkdir -p heic_output
          python pds4_to_heic.py --glob "TCAM/*.2CL" --output-dir heic_output
          python pds4_to_heic.py --glob "PCAM/*.2BL" --output-dir heic_output

          echo ""
          echo "=== HEIC output files ==="
          ls -lh heic_output/

      # ---------------------------------------------------------------
      # 7. Upload HEIC files as workflow artifacts (available on PR)
      # ---------------------------------------------------------------
      - name: Upload HDR HEIC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ce4-hdr-heic-images
          path: heic_output/*.heic
          if-no-files-found: error
          retention-days: 30
